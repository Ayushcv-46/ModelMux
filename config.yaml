routing:
  strategy: priority  # options: priority, round_robin, explicit
  priority:
    - groq
    - gemini
    - ollama

reliability:
  total_timeout_seconds: 30.0
  max_attempts: 3
  base_delay: 0.1
  max_delay: 10.0
  circuit_breaker_failure_threshold: 3
  circuit_breaker_recovery_timeout: 30.0

redis:
  url: "redis://localhost:6379/0"
  connect_timeout: 2.0

providers:
  groq:
    timeout_seconds: 30.0
    models:
      - openai/gpt-oss-20b
      - openai/gpt-oss-120b
  gemini:
    timeout_seconds: 30.0
    models:
      - gemini-3.5-flash-lite
  ollama:
    timeout_seconds: 60.0
    models:
      - qwen2.5:3b
  mock:
    timeout_seconds: 5.0
    models:
      - mock-1
